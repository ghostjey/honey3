<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>น้ำผึ้งป่าแท้ – สั่งซื้อออนไลน์</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@500&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--g:#12372a;--y:#e8a317;--bg:#fff;--t:#1d2a24;--l:#dfe5e1}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a15;--t:#e9efeb;--l:#2a3a32}}
*{box-sizing:border-box}body{margin:0;font:17px/1.6 Sarabun,sans-serif;background:var(--bg);color:var(--t)}
h1,h2{font-family:Mitr,sans-serif;font-weight:500;line-height:1.25}
.w{max-width:920px;margin:auto;padding:0 20px}
.hero{background:var(--g);color:#fff;padding:64px 0}
.hero h1{font-size:clamp(32px,6vw,52px);margin:0 0 12px}.hero p{max-width:520px;margin:0 0 24px;opacity:.9}
.btn{display:inline-block;background:var(--y);color:#1d1400;border:0;border-radius:8px;padding:12px 24px;font:600 17px Sarabun;cursor:pointer;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin:24px 0}
.p{border:1px solid var(--l);border-radius:10px;overflow:hidden}
.p img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--l);display:block}
.p div{padding:16px}.p b{font-size:20px}
.price{color:var(--y);font-weight:600;font-size:20px}
input,textarea{width:100%;padding:10px;border:1px solid var(--l);border-radius:8px;font:inherit;background:var(--bg);color:var(--t)}
label{display:block;margin:12px 0 4px;font-weight:600}
.q{width:80px!important}
#msg{margin-top:16px;font-weight:600}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
footer{padding:32px 0;border-top:1px solid var(--l);margin-top:48px;font-size:14px;opacity:.8}
</style></head><body>
<header class="hero"><div class="w">
<h1>น้ำผึ้งป่าแท้ ไม่ผสม ไม่ปรุงแต่ง</h1>
<p>เก็บจากรังผึ้งโดยตรง บรรจุขวดแก้ว ส่งถึงบ้านทั่วประเทศภายใน 1–3 วันทำการ</p>
<a class="btn" href="#order">สั่งซื้อเลย</a></div></header>
<main class="w">
<h2>เลือกขนาดที่ใช่</h2>
<div class="grid" id="products"></div>
<h2 id="order">กรอกข้อมูลจัดส่ง</h2>
<form id="f" onsubmit="return false">
<div id="qtys"></div>
<label for="name">ชื่อผู้รับ</label><input id="name" required>
<label for="phone">เบอร์โทร</label><input id="phone" type="tel" pattern="[0-9]{9,10}" required>
<label for="addr">ที่อยู่จัดส่ง (รวมรหัสไปรษณีย์)</label><textarea id="addr" rows="3" required></textarea>
<p>ยอดรวม: <span class="price" id="total">0</span> บาท (ค่าส่งคิดตามจริง)</p>
<button class="btn" id="go">ยืนยันสั่งซื้อ</button>
<div id="msg" role="status"></div>
</form></main>
<footer><div class="w">© ร้านน้ำผึ้งป่า – โปรเจกต์นักศึกษา</div></footer>
<script>
// ====== แก้ค่าตรงนี้ ======
const SHEET_URL = "PASTE_APPS_SCRIPT_WEB_APP_URL_HERE";
const PRODUCTS = [
 {sku:"HNY-250", name:"น้ำผึ้งป่า 250 มล.", price:120, img:"images/hny-250.jpg", desc:"ขนาดทดลอง เหมาะกับครัวเรือนเล็ก"},
 {sku:"HNY-500", name:"น้ำผึ้งป่า 500 มล.", price:220, img:"images/hny-500.jpg", desc:"ขวดใหญ่ คุ้มกว่า เหมาะเป็นของฝาก"}
];
// =========================
const $=id=>document.getElementById(id);
$("products").innerHTML=PRODUCTS.map(p=>`<div class="p"><img src="${p.img}" alt="${p.name}" loading="lazy"><div><b>${p.name}</b><p>${p.desc}</p><span class="price">${p.price} บาท</span></div></div>`).join("");
$("qtys").innerHTML=PRODUCTS.map(p=>`<label for="q-${p.sku}">${p.name} (${p.price} บาท)</label><input class="q" type="number" min="0" value="0" id="q-${p.sku}">`).join("");
const items=()=>PRODUCTS.map(p=>({...p,qty:+$("q-"+p.sku).value||0})).filter(p=>p.qty>0);
const sum=()=>items().reduce((s,p)=>s+p.qty*p.price,0);
$("qtys").oninput=()=>$("total").textContent=sum().toLocaleString();
$("f").onsubmit=async()=>{
 const it=items(),m=$("msg");
 if(!it.length){m.textContent="กรุณาเลือกสินค้าอย่างน้อย 1 ชิ้น";return false}
 const order={orderId:"ORD"+Date.now().toString().slice(-8),name:$("name").value.trim(),phone:$("phone").value.trim(),address:$("addr").value.trim(),items:it.map(({sku,name,price,qty})=>({sku,name,price,qty}))};
 $("go").disabled=true;m.textContent="กำลังส่งคำสั่งซื้อ...";
 try{
  await fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(order)});
  m.textContent="สั่งซื้อสำเร็จ เลขที่ออเดอร์ "+order.orderId+" ร้านจะติดต่อกลับเพื่อแจ้งยอดโอน";
  $("f").reset();$("total").textContent=0;
 }catch(e){m.textContent="ส่งไม่สำเร็จ กรุณาลองใหม่อีกครั้ง"}
 $("go").disabled=false;return false};
</script></body></html>
